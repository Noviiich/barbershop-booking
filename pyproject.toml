[project]
name = "barbershop-booking"
version = "0.1.0"
description = "Backend for reliable barbershop booking"
requires-python = "==3.13.*"
dependencies = [
    "django==5.2.17",
    "djangorestframework==3.16.1",
    "psycopg[binary]==3.3.5",
]

[build-system]
requires = ["uv_build==0.12.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.6",
]

[tool.uv]
required-version = ">=0.12.11,<0.13"

[tool.uv.build-backend]
module-name = "barbershop"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "barbershop.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".serena"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["^\\.serena/"]
