name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13.14

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run checks
        run: make check

      - name: Run bootstrap smoke test
        run: uv run --frozen pytest tests/smoke/test_bootstrap.py
